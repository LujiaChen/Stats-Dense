name: Bug report
description: Report a reproducible problem in Stats Dense.
body:
  - type: markdown
    attributes:
      value: Dense currently has five fixed metrics. Other widgets cannot replace them. Please redact private information from logs and screenshots.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include macOS, Mac/chip, app version, display mode, and enabled modules. Do not include a serial number.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Redacted screenshots or logs
