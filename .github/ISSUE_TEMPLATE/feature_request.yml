name: Feature request
description: Suggest a focused improvement to Stats Dense.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What would this improve, especially on a space-constrained menu bar?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Configurable Dense slots are not part of the current five-metric release.
    validations:
      required: true
